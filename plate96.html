<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>96 孔板标记 · LabTools</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230e7a8a'/><circle cx='16' cy='16' r='6' fill='white'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page plate-page">
  <section class="cinematic-shell">
    <video class="scene-video" autoplay loop muted playsinline preload="auto" aria-hidden="true">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4" type="video/mp4">
    </video>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="logo" aria-label="LabTools 首页">
          LabTools<sup>LAB</sup>
        </a>
        <a href="index.html" class="back-home">← 返回首页</a>
      </div>
    </header>
    <div class="container cinematic-copy">
      <p class="eyebrow">Plate planning</p>
      <h1>先把每一个孔，<br>安排得明明白白。</h1>
      <p>规划样品、标准品、空白与对照；所有标记自动保存在当前浏览器。</p>
    </div>
  </section>

  <main class="container tool-workspace plate-workspace">

    <div class="plate-toolbar">
      <div class="plate-select">
        <select id="plateList" title="切换实验板"></select>
        <button class="btn ghost" id="addPlateBtn" title="新建实验板">＋ 新建板</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索孔内容，如：样品、BSA、PBS…" autocomplete="off">
      </div>
      <button class="btn ghost" id="multiSelectBtn" title="开启后点击孔位可多选，也可直接拖动框选">☑ 多选模式</button>
      <button class="btn ghost" id="exportBtn">导出 CSV</button>
      <button class="btn danger" id="clearBtn">清空本板</button>
    </div>

    <div class="legend" id="legend"></div>

    <div class="selection-bar" id="selectionBar" hidden>
      <span class="selection-info" id="selectionInfo">已选中 0 个孔</span>
      <button class="btn" id="batchEditBtn">批量标记</button>
      <button class="btn ghost" id="batchClearBtn">清除选中孔标记</button>
      <button class="btn ghost" id="clearSelectionBtn">取消选中</button>
    </div>

    <div class="plate-wrap">
      <div class="plate" id="plate"></div>
      <div class="stats" id="stats"></div>
    </div>
  </main>

  <footer class="site-footer tool-footer">
    <div class="container">LabTools · 本地数据仅保存在浏览器中</div>
  </footer>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h3 id="modalTitle">标记孔位</h3>
      <p class="well-id" id="modalWellId"></p>
      <div class="form-field">
        <label>标记类型</label>
        <div class="type-options" id="typeOptions"></div>
      </div>
      <div class="form-field">
        <label>孔内容（可留空）</label>
        <input type="text" id="wellNote" placeholder="如：细胞A / 100ng BSA / PBS…" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="clearWellBtn">清除标记</button>
        <button class="btn ghost" id="modalCancel">取消</button>
        <button class="btn" id="modalSave">保存</button>
      </div>
    </div>
  </div>

  <script src="js/plate96.js"></script>
</body>
</html>
