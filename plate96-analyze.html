<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>96 孔板 Excel 分析 · LabTools</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230e7a8a'/><circle cx='16' cy='16' r='6' fill='white'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page analysis-page">
  <section class="cinematic-shell">
    <video class="scene-video" autoplay loop muted playsinline preload="auto" aria-hidden="true">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4" type="video/mp4">
    </video>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="logo" aria-label="LabTools 首页">
          LabTools<sup>LAB</sup>
        </a>
        <a href="index.html" class="back-home">← 返回首页</a>
      </div>
    </header>
    <div class="container cinematic-copy">
      <p class="eyebrow">Time-series analysis</p>
      <h1>让每一个时间点，<br>都讲清实验变化。</h1>
      <p>导入吸光度数据，自动识别 8×12 区域，并生成热图、变化曲线和分析工作簿。</p>
    </div>
  </section>

  <main class="container tool-workspace analysis-workspace">

    <!-- Step 1: 导入 -->
    <section class="panel" id="importPanel">
      <h2><span class="step-number">01</span><span>导入 Excel</span></h2>
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm,.csv" hidden>
        <p class="drop-title">点击选择，或把 Excel 拖到这里</p>
        <p class="hint">支持 .xlsx / .xls / .csv，每个工作表视为一个时间点</p>
      </div>
      <p class="notice" id="importMsg" hidden></p>
    </section>

    <!-- Step 2: 识别与参数 -->
    <section class="panel" id="configPanel" hidden>
      <h2><span class="step-number">02</span><span>识别与参数</span></h2>
      <div class="config-row">
        <label class="field-inline">
          检测波长
          <input type="text" id="wavelength" value="450" inputmode="decimal" placeholder="450">
          nm
        </label>
        <label class="field-inline">
          时间单位
          <select id="timeUnit">
            <option value="h">小时</option>
            <option value="min">分钟</option>
            <option value="d">天</option>
          </select>
        </label>
      </div>

      <div class="table-wrap">
        <table class="data-table" id="sheetTable">
          <thead>
            <tr>
              <th>工作表</th>
              <th>时间（<span class="unit-label">小时</span>）</th>
              <th>识别状态</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="actions">
        <button class="btn" id="parseBtn">解析并预览</button>
      </div>
    </section>

    <!-- Step 3: 孔位选择与预览 -->
    <section class="panel" id="previewPanel" hidden>
      <h2><span class="step-number">03</span><span>孔位选择与预览</span></h2>

      <div class="summary" id="summary"></div>

      <div class="chart-block">
        <div class="chart-block-head">
          <h3>热图预览</h3>
          <label class="field-inline">
            时间点
            <select id="heatmapTimeSelect"></select>
          </label>
        </div>
        <div class="chart-canvas-wrap">
          <canvas id="heatmapCanvas"></canvas>
        </div>
      </div>

      <div class="chart-block">
        <div class="chart-block-head">
          <h3>变化曲线（选中孔位）</h3>
          <span class="hint" id="lineHint">请在下方的孔板中选择要绘图的孔位</span>
        </div>
        <div class="chart-canvas-wrap line-wrap">
          <canvas id="lineCanvas"></canvas>
        </div>
      </div>

      <div class="well-select-tools">
        <span class="selection-info" id="wellSelInfo">已选 0 个孔</span>
        <button class="btn ghost" id="selectAllBtn">全选</button>
        <button class="btn ghost" id="clearSelBtn">清空</button>
        <button class="btn ghost" id="selectRowsBtn">按行选择</button>
        <button class="btn ghost" id="selectColsBtn">按列选择</button>
      </div>
      <div class="plate-wrap">
        <div class="plate" id="wellGrid"></div>
      </div>

      <div class="actions">
        <button class="btn" id="exportBtn">导出分析工作簿</button>
        <span class="hint" id="exportMsg"></span>
      </div>
    </section>
  </main>

  <footer class="site-footer tool-footer">
    <div class="container">LabTools · 本地数据仅保存在浏览器中 · 解析与导出均在本地完成</div>
  </footer>

  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/vendor/chart.umd.js"></script>
  <script src="js/vendor/exceljs.min.js"></script>
  <script src="js/excel96.js"></script>
</body>
</html>
